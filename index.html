<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Nạp Kim Cương Free Fire - ZaloPay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 25px 15px;
        }
        /* Khung chứa tổng thể: To hơn, viền cong 20px */
        .container {
            background: #131b2e;
            border: 3px solid #00e5ff;
            border-radius: 20px;
            padding: 35px 30px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.4);
        }
        h2 {
            text-align: center;
            color: #00e5ff;
            font-size: 24px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
        }
        .form-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 15px;
            color: #cbd5e1;
            font-weight: bold;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        /* Ô nhập liệu: To hơn, viền cong 12px */
        input {
            width: 100%;
            padding: 14px 16px;
            background: #0b0f19;
            border: 2px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }
        input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
            outline: none;
        }
        /* Nút Xác Minh: Viền cong 12px */
        .verify-btn {
            background: #00e5ff;
            color: #0b0f19;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
            transition: 0.3s;
        }
        .verify-btn:hover {
            background: #38bdf8;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
        }
        /* Khung thông báo xác minh: Viền cong 12px */
        .verify-status {
            display: none;
            margin-top: 10px;
            padding: 10px 14px;
            background: rgba(34, 197, 94, 0.1);
            border: 1.5px solid #22c55e;
            border-radius: 12px;
            color: #22c55e;
            font-size: 14px;
            font-weight: bold;
        }

        /* Bảng gói KC: Các ô to rõ, viền cong 15px */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
        }
        .pkg-card {
            background: #1b263b;
            border: 2px solid #334155;
            border-radius: 15px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
